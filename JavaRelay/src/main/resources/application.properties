spring.application.name=JavaRelay

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/JavaRelay?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=wadsprq5221

spring.data.redis.host=127.0.0.1
spring.data.redis.port=6379
spring.data.redis.database=0

# JWT：secret 必须 >= 32 字节，生产环境请用环境变量覆盖
jwt.secret=javarelay-dev-secret-please-change-in-production-32bytes
jwt.expire-minutes=120

rocketmq.name-server=127.0.0.1:9876
rocketmq.producer.group=javarelay-producer
rocketmq.producer.send-message-timeout=3000

# ---- graceful shutdown ----
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
spring.task.scheduling.shutdown.await-termination=true
spring.task.scheduling.shutdown.await-termination-period=20s
